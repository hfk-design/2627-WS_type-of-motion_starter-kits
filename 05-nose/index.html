<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>05 Nose</title>
    <link rel="stylesheet" href="../shared/css/style.css">
    <style>
      /* page-specific: every placed letter */
      .letter {
        position: absolute;
        font-size: 64px;   /* size of the letters */
        line-height: 1;
        white-space: pre;
        user-select: none;
      }
    </style>

    <!-- p5.js (camera + drawing) and ml5.js (pose recognition) -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1.2.1/dist/ml5.min.js"></script>
  </head>
  <body>

    <!-- the letters are added in here -->
    <div id="drawing"></div>

    <!-- labels -->
    <p class="corner top-left"><a href="../index.html">Index</a> / 05 Nose</p>
    <p class="corner top-right readout" id="readout">loading model …</p>
    <p class="corner bottom-left">
      Move your head to write.<br>
      Space or double-click → clear<br><br>
      Font: <a href="https://timesnewarial.liebermannkiepereddemann.de/" target="_blank">Times New Arial</a>
    </p>

    <!-- p5 adds the camera preview <canvas> here (bottom right) -->

    <script src="sketch.js"></script>
  </body>
</html>
